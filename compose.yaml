# The whole local system, one command: docker compose up --build
# Compose puts both services on one private network, where each service name
# is also a hostname: execution-api reaches the database at "sqlserver".

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # The image exists only for amd64; on Apple Silicon it runs under emulation (Rosetta).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      # ${...} comes from the .env file next to this one (see .env.example).
      # The :? makes Compose stop with this message if the value is missing.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?copy .env.example to .env}
    ports:
      # host:container. Lets tools on your Mac (Azure Data Studio, DBeaver) connect.
      - "1433:1433"
    volumes:
      # Named volume: the data survives "docker compose down" (but not "down -v").
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # "Healthy" = it answers a real query, not just "the process started".
      # -C trusts the self-signed certificate, -b turns a SQL error into exit code 1.
      # $$ = a literal $ for the shell inside the container (one $ would be filled in by Compose).
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' -b',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      # Checks that fail during the first 30s don't count: SQL Server is slow to boot, more so emulated.
      start_period: 30s

  # One-shot job: runs db/init.sql once SQL Server is healthy, then exits.
  # Same image only because it already contains sqlcmd; it starts no second database.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      APPDATA_DB_PASSWORD: ${APPDATA_DB_PASSWORD:?copy the new lines from .env.example to .env}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:?copy the new lines from .env.example to .env}
    volumes:
      # Bind mount: a file from this repo, read-only (:ro) inside the container.
      - ./db/init.sql:/init.sql:ro
    # Replaces the image's own start command (which would start SQL Server).
    # -S sqlserver: connect to the OTHER container by service name, not localhost.
    # -i: run this file. -v: fill the $(...) variables in it. -b: exit code 1 on any SQL error.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -i /init.sql
        -v APPDATA_DB_PASSWORD="$$APPDATA_DB_PASSWORD" IAM_DB_PASSWORD="$$IAM_DB_PASSWORD"

  execution-api:
    build:
      # Build from the repo root, because the parent pom.xml lives there.
      context: .
      dockerfile: execution-api/Dockerfile
    image: execution-api:dev
    depends_on:
      sqlserver-init:
        # Wait until the init job has EXITED with code 0. "healthy" doesn't apply:
        # a job that finishes is never healthy, it's done.
        condition: service_completed_successfully
    environment:
      # Spring Boot maps these to properties: SPRING_DATASOURCE_URL -> spring.datasource.url.
      # "sqlserver" is the service name above, resolved by Compose's built-in DNS.
      # trustServerCertificate: the dev server's certificate is self-signed.
      # Own database + own login (created by db/init.sql): this service can't open iam.
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=appdata;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: appdata_svc
      SPRING_DATASOURCE_PASSWORD: ${APPDATA_DB_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      # shortcut: checks GET /projects; sprint 3 switches to Actuator's /actuator/health.
      test: ["CMD", "curl", "-fs", "http://localhost:8080/projects"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
