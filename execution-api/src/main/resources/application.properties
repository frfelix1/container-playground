# Flyway owns the database structure: it creates and changes tables (db/migration/V*.sql).
# Hibernate only CHECKS at startup that every @Entity matches a real table and its columns,
# and refuses to start on a mismatch.
# Never use "update": Hibernate would change the schema behind Flyway's back,
# and the migration history would no longer describe the real database.
spring.jpa.hibernate.ddl-auto=validate
